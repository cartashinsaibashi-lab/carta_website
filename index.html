<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141138">
  <title>CARTA POKER SERIES | Tournament Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="wolf">

  <!-- 初期ローディング(API取得が完了して描画されるまで表示) -->
  <div class="app-loading" id="appLoading">
    <div class="loader-spinner"></div>
  </div>

  <!-- 初回表示: どのシリーズを見るかを選ぶ全画面パネル。
       js/app.js が表示制御する(?event= の直リンク時は出さない)。 -->
  <div class="category-gate" id="categoryGate" role="dialog" aria-modal="true"
       aria-label="シリーズを選択" hidden>
    <div class="gate-inner">
      <p class="gate-brand">CARTA POKER SERIES</p>
      <p class="gate-lead">Select a series</p>
      <!-- ロゴのみを横 3 つ並べる。名前は出さないので、読み上げ用に aria-label を付ける。
           宴は暗い画面用の白ロゴ(assets/logo.png)を使う。 -->
      <div class="gate-list">
        <button class="gate-item" type="button" data-category="wolf" aria-label="Wolf">
          <img class="gate-icon" src="assets/logo-wolf.png" alt="">
        </button>
        <button class="gate-item" type="button" data-category="utage" aria-label="宴 Utage">
          <img class="gate-icon" src="assets/logo.png" alt="">
        </button>
        <button class="gate-item" type="button" data-category="other" aria-label="その他・コラボイベント等">
          <img class="gate-icon" src="assets/logo-other.png" alt="">
        </button>
      </div>
    </div>
    <!-- 選択後に、選んだシリーズのロゴだけを中央に出す(src は app.js が差し替える) -->
    <div class="gate-splash" aria-hidden="true">
      <img class="gate-splash-icon" src="" alt="">
    </div>
  </div>

  <!-- Header: 左にブランド / 右にカテゴリ(スートアイコン) -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">CARTA POKER SERIES</span>
          <span class="brand-sub">Official Tournament Schedule</span>
        </div>
      </div>
      <nav class="category-tabs" id="categoryTabs" aria-label="Category">
        <button class="category-tab is-active" data-category="wolf" title="Wolf" aria-label="Wolf">
          <img class="category-tab-icon" src="assets/logo-wolf.png" alt="Wolf">
          <span class="category-tab-count" data-count="wolf">0</span>
        </button>
        <button class="category-tab" data-category="utage" title="Utage" aria-label="Utage">
          <img class="category-tab-icon" src="assets/logo.png" alt="Utage">
          <span class="category-tab-count" data-count="utage">0</span>
        </button>
        <button class="category-tab" data-category="other" title="Other" aria-label="Other">
          <img class="category-tab-icon" src="assets/logo-other.png" alt="Other">
          <span class="category-tab-count" data-count="other">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
   <div class="content-panel">

    <!-- Date / status filter (sticks to top while scrolling) -->
    <div class="filter-bar" id="filterBar">

    <!-- Date selector -->
    <div class="date-strip" aria-label="Filter by date">
      <div class="month-nav" id="monthNav"></div>
      <button class="date-cell date-cell-all" id="dateAllBtn" type="button">
        <span class="date-all-label">All</span>
      </button>
      <div class="date-strip-scroll" id="dateStrip"></div>
    </div>

    <!-- Status filter (5ボタン横一列: すべて/お気に入り/開催状況) -->
    <div class="status-filter" id="statusFilter" aria-label="Status filter">
      <div class="status-row">
        <button class="status-pill is-active" data-status="all"><span class="pill-label">All</span></button>
        <button class="status-pill" data-status="running"><span class="dot dot-live"></span><span class="pill-label">Live</span></button>
        <button class="status-pill" data-status="future"><span class="dot dot-future"></span><span class="pill-label">Open</span></button>
        <button class="status-pill" data-status="past"><span class="dot dot-past"></span><span class="pill-label">Close</span></button>
        <button class="status-pill fav-pill" id="favFilter" type="button" title="Favorites" aria-label="Favorites"><span class="fav-pill-star">★</span></button>
      </div>
    </div>

    </div><!-- /.filter-bar -->

    <!-- Event list (cards + accordion) -->
    <section class="event-list" id="eventList"></section>

    <p class="empty-message" id="emptyMessage" hidden>No tournaments available right now.</p>
   </div><!-- /.content-panel -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CARTA POKER SERIES. All rights reserved.</p>
    </div>
  </footer>

  <!-- Entry modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-label="Tournament Entry"></div>
  </div>

  <!-- api.js が /api/events を取得してグローバル(MOCK_EVENTS / CALENDAR)を用意し、
       app.js を注入して起動する。取得失敗時はダミーを出さず空/エラー表示にフォールバックする。 -->
  <script src="js/api.js"></script>
</body>
</html>
